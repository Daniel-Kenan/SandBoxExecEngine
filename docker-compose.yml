version: '3.8'
# (No 'version:' line needed)

services:
  api:
    build: .
    command: uvicorn sandbox_server:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      - c_runtime
      - python_runtime    # matches the service key below
      - js_runtime
      - pwsh_runtime
      - bash_runtime

  c_runtime:
    image: gcc:latest
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  python_runtime:
    image: python:3.10-slim
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  js_runtime:
    image: node:16-slim
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  pwsh_runtime:
    image: mcr.microsoft.com/powershell:latest
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  bash_runtime:
    image: debian:stable-slim
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
