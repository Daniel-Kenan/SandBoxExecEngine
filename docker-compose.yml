services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - python_runtime
      - c_runtime
      - js_runtime
      - pwsh_runtime
      - bash_runtime

  python_runtime:
    build:
      context: ./runtimes/python
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  c_runtime:
    build:
      context: ./runtimes/c

  js_runtime:
    build:
      context: ./runtimes/javascript

  bash_runtime:
    build:
      context: ./runtimes/bash

  pwsh_runtime:
    image: mcr.microsoft.com/powershell:latest
